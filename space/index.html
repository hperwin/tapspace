<script type="module">
/* ---- presence HUD (top right): fully automatic, agents report nothing ----
   Rows come from the server's own request stream; the session count comes
   from Claude transcript mtimes on disk. anime.js drives the motion; if the
   import ever fails the HUD still renders statically. */
let A = null;
try{ A = await import('/anime.esm.js'); }catch(e){}

const sessdots = document.getElementById('sessdots');
const sesstext = document.getElementById('sesstext');
const actrows = document.getElementById('actrows');
const rows = new Map();      // key -> {el, kind, state, anims:[]}
let dotSig = '';
const anims = {dots: []};

function cancelAll(list){ for (const a of list){ try{ a.cancel(); }catch(e){} } list.length = 0; }

function ring(kind){
  const svgNS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(svgNS, 'svg');
  s.setAttribute('viewBox', '0 0 16 16');
  const c = document.createElementNS(svgNS, 'circle');
  c.setAttribute('cx', 8); c.setAttribute('cy', 8); c.setAttribute('r', 6);
  s.appendChild(c);
  return s;
}

function animateRing(row){
  cancelAll(row.anims);
  const c = row.el.querySelector('circle');
  const s = row.el.querySelector('svg');
  if (!A){ return; }
  if (row.state === 'fading'){ return; }
  if (row.kind === 'waiting'){
    // full quiet ring, breathing: "your move"
    c.removeAttribute('stroke-dasharray');
    row.anims.push(A.animate(c, {opacity: [.3, .95], duration: 1500,
      alternate: true, loop: true, ease: 'inOutSine'}));
  } else {
    // the checkmark-circle feel: a drawing arc that chases itself
    try{
      const d = A.svg.createDrawable(c);
      row.anims.push(A.animate(d, {draw: ['0 0', '0 1', '1 1'],
        duration: 1900, loop: true, ease: 'inOutSine'}));
    }catch(e){
      c.setAttribute('stroke-dasharray', '26 12');
    }
    row.anims.push(A.animate(s, {rotate: 360, duration: 2400, loop: true, ease: 'linear'}));
  }
}

function enter(el){
  if (!A){ el.style.opacity = 1; return; }
  A.animate(el, {opacity: [0, 1], filter: ['blur(8px)', 'blur(0px)'],
    translateY: [-6, 0], duration: 700, ease: 'out(3)'});
}

function exit(el, done){
  if (!A){ el.remove(); done(); return; }
  A.animate(el, {opacity: 0, filter: 'blur(8px)', translateY: -6,
    duration: 450, ease: 'in(2)', onComplete: () => { el.remove(); done(); }});
}

function renderDots(sess){
  const working = Math.min(sess.working || 0, 8);
  const idle = Math.min(Math.max((sess.recent || 0) - (sess.working || 0), 0), 8 - working);
  const sig = working + '|' + idle;
  if (sig === dotSig) return;
  dotSig = sig;
  cancelAll(anims.dots);
  sessdots.innerHTML = '';
  for (let i = 0; i < working; i++){
    const d = document.createElement('span');
    d.className = 'sdot2 working';
    sessdots.appendChild(d);
  }
  for (let i = 0; i < idle; i++){
    const d = document.createElement('span');
    d.className = 'sdot2';
    sessdots.appendChild(d);
  }
  if (A && working){
    anims.dots.push(A.animate([...sessdots.querySelectorAll('.working')],
      {scale: [.8, 1.3], opacity: [.45, 1], duration: 850, alternate: true,
       loop: true, ease: 'inOutSine', delay: A.stagger(140)}));
  }
}

async function hudTick(){
  let d;
  try{
    d = await (await fetch('/api/activity')).json();
  }catch(e){
    sesstext.textContent = 'reconnecting';
    return;
  }
  const sess = d.sessions || {};
  sesstext.textContent = (sess.working || 0) + ' working · ' + (sess.recent || 0) + ' sessions';
  renderDots(sess);

  const seen = new Set();
  const list = d.rows.slice(0, 4);
  for (const r of list){
    const key = r.campaign + '|' + r.agent;
    seen.add(key);
    const cls = 'actrow ' + r.kind + (r.state === 'fading' ? ' fading' : '');
    let row = rows.get(key);
    if (!row){
      const el = document.createElement('div');
      el.className = cls;
      el.style.opacity = 0;
      el.appendChild(ring(r.kind));
      const label = document.createElement('span');
      label.innerHTML = '<span class="who"></span> <span class="what"></span>';
      el.appendChild(label);
      actrows.appendChild(el);
      row = {el, kind: r.kind, state: r.state, anims: []};
      rows.set(key, row);
      enter(el);
      animateRing(row);
    }
    row.el.querySelector('.who').textContent = r.agent;
    row.el.querySelector('.what').textContent = '· ' + r.verb;
    if (row.kind !== r.kind || row.state !== r.state){
      row.kind = r.kind; row.state = r.state;
      row.el.className = cls;
      animateRing(row);
    }
  }
  for (const [key, row] of rows){
    if (!seen.has(key)){
      rows.delete(key);
      cancelAll(row.anims);
      exit(row.el, () => {});
    }
  }
}

hudTick();
setInterval(hudTick, 2000);
</script>

<script type="module">
/* ---- progress panel (Chat tab, right column) + agent-to-agent links ----
   One card per live agent: its goal, a segmented step track and where it is now.
   Two agents talking to each other sit next to each other, joined in the face
   column by a line that carries the HUD's chasing draw from sender to receiver.
   Data rides script 2's /api/agents poll (window.tsPanel.render). Without
   anime.js, or with Reduce Motion, everything renders still. */
let A = null;
try{ A = await import('/anime.esm.js'); }catch(e){}

// ---- pure: who gets a card, the order, the talking pairs, the step line (no DOM) ----
const LIVE_STATES = new Set(['thinking', 'here', 'switching', 'starting']);
const KEEP = 600;     // an away agent keeps its card 10 minutes after it was last seen or spoke
const WINDOW = 600;   // a pair draws while the server calls its link active and the newest message is under 10 minutes old
function isLive(a, now){
  return !!(a.progress && typeof a.progress === 'object') || LIVE_STATES.has(a.state) ||
    now - Math.max(+a.seen || 0, +a.last_master || 0) < KEEP;
}
function planOf(a){
  const p = a.progress;
  if (!p || typeof p !== 'object') return null;
  const steps = (Array.isArray(p.steps) ? p.steps : []).filter(s => typeof s === 'string' && s.trim()).map(s => s.trim());
  const n = steps.length, c = Math.floor(+p.current);
  const cur = Math.max(0, Math.min(Number.isFinite(c) ? c : 0, n));
  return {goal: typeof p.goal === 'string' ? p.goal.trim() : '', steps, n, cur, done: n > 0 && cur >= n,
          note: typeof p.note === 'string' ? p.note.trim() : '', updated: +p.updated || 0};
}
function stepLine(m){
  if (!m || !m.n) return null;
  return m.done ? {count: 'Done', text: m.n + ' of ' + m.n} : {count: (m.cur + 1) + ' of ' + m.n, text: m.steps[m.cur]};
}
function byFirst(x, y){
  return ((+x.first || +x.seen || 0) - (+y.first || +y.seen || 0)) || (x.name < y.name ? -1 : x.name > y.name ? 1 : 0);
}
function board(list, links, now){
  const live = (Array.isArray(list) ? list : []).filter(a => a && a.name && isLive(a, now)).sort(byFirst);
  const names = new Set(live.map(a => a.name));
  const best = new Map();                          // one link per pair, the newest
  for (const l of Array.isArray(links) ? links : []){
    if (!l || !l.active || now - (+l.last || 0) >= WINDOW || !l.a || !l.b || l.a === l.b || !names.has(l.a) || !names.has(l.b)) continue;
    const k = l.a < l.b ? l.a + '|' + l.b : l.b + '|' + l.a;
    if (!best.has(k) || (+l.last || 0) > (+best.get(k).last || 0)) best.set(k, l);
  }
  const partner = new Map();                       // greedy by newest: each agent joins at most one pair
  for (const [k, l] of [...best].sort((x, y) => (+y[1].last || 0) - (+x[1].last || 0))){
    if (partner.has(l.a) || partner.has(l.b)) continue;
    partner.set(l.a, {k, l, other: l.b}); partner.set(l.b, {k, l, other: l.a});
  }
  const order = [], pairs = [], placed = new Set();
  for (const a of live){                           // stable by first; a pair's later member moves up under the earlier
    if (placed.has(a.name)) continue;
    order.push(a); placed.add(a.name);
    const p = partner.get(a.name);
    if (p && !placed.has(p.other)){
      order.push(live.find(x => x.name === p.other)); placed.add(p.other);
      const from = p.l.from === p.other ? p.other : a.name;
      pairs.push({key: p.k, upper: a.name, lower: p.other, from, to: from === a.name ? p.other : a.name, link: p.l});
    }
  }
  return {order, pairs};
}
// ---- end pure ----

const plansEl = document.getElementById('plans');
const svg = plansEl.querySelector('.links');
const SVGNS = 'http://www.w3.org/2000/svg';
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const NARROW = matchMedia('(max-width:1180px)');
const lb = document.getElementById('lightbox');
const pcards = new Map();   // agent key -> card parts
const pgaps = new Map();    // pair key -> the gap label + its connector paths
let emptyEl = null;
let boardSig = '';          // the cards in order plus the pairs, as last laid out
let wasShown = false;       // the panel was on screen at the last syncMotion

const still = () => !A || RM.matches;
function shown(){
  return document.body.classList.contains('chatmode') && !NARROW.matches &&
    !lb.classList.contains('open') && document.visibilityState === 'visible';
}
function cancelAll(list){ for (const a of list){ try{ a.cancel(); }catch(e){} } list.length = 0; }
function clean(el){ el.style.opacity = ''; el.style.filter = ''; el.style.transform = ''; }
function enter(el, i){
  if (still()){ clean(el); return; }
  el.style.opacity = '0';
  A.animate(el, {opacity: [0, 1], filter: ['blur(8px)', 'blur(0px)'], translateY: [8, 0], duration: 700,
    delay: Math.min(i, 5) * 70, ease: 'out(3)', onComplete: () => clean(el)});
}
function exit(el, done){
  if (still()){ done(); return; }
  A.animate(el, {opacity: 0, filter: 'blur(8px)', translateY: 6, duration: 450, ease: 'in(2)', onComplete: done});
}
function nod(el){
  if (still()) return;
  A.animate(el, {scale: [1, 1.025, 1], duration: 520, ease: 'out(3)', onComplete: () => { el.style.transform = ''; }});
}
function setText(el, t){ if (el.textContent !== t) el.textContent = t; }

// The connectors follow the cards for `ms` (a glide, a gap opening or closing), frame by frame, and only while the
// panel is on screen: a window asked for while it is hidden resumes when it shows (syncMotion).
let until = 0, raf = 0;
function scheduleLayout(ms){
  until = Math.max(until, performance.now() + ms);
  if (!raf && shown()) raf = requestAnimationFrame(frame);
}
function frame(){
  raf = 0;
  if (!shown()) return;
  layout();
  if (performance.now() < until) raf = requestAnimationFrame(frame);
}
function layout(){
  if (!plansEl.offsetParent) return;               // panel hidden: Visual tab or a narrow window
  svg.style.height = plansEl.scrollHeight + 'px';
  for (const g of pgaps.values()){
    const up = pcards.get(agentKey(g.upper)), lo = pcards.get(agentKey(g.lower));
    if (!up || !lo || !up.el.isConnected || !lo.el.isConnected){ g.grp.style.display = 'none'; continue; }
    const x = up.el.offsetLeft + up.orb.offsetLeft + up.orb.offsetWidth / 2;
    const y1 = up.el.offsetTop + up.orb.offsetTop + up.orb.offsetHeight + 6;
    const y2 = lo.el.offsetTop + lo.orb.offsetTop - 6;
    g.grp.style.display = y2 - y1 > 4 ? '' : 'none';
    const d = g.down ? `M${x} ${y1}L${x} ${y2}` : `M${x} ${y2}L${x} ${y1}`;
    if (g.d !== d){ g.base.setAttribute('d', d); g.run.setAttribute('d', d); g.d = d; }
  }
}
const ro = new ResizeObserver(() => scheduleLayout(0));
ro.observe(plansEl);

function makeCard(key){
  const el = document.createElement('button');
  el.type = 'button'; el.className = 'plan'; el.dataset.key = key;
  el.innerHTML = `<span class="orb"></span><span class="pcol"><span class="ptop"><span class="nm"></span>` +
    `<span class="ago"></span><span class="unread"></span></span><span class="star"></span>` +
    `<span class="track"></span><span class="stepline"></span></span>`;
  el.addEventListener('click', () => openThread(key));
  const q = s => el.querySelector(s);
  ro.observe(el);
  return {key, el, orb: q('.orb'), nm: q('.nm'), ago: q('.ago'), dot: q('.unread'), star: q('.star'),
          track: q('.track'), line: q('.stepline'), tsig: null, lsig: null, cur: null, pingT: 0};
}
function drawTrack(t, m){
  if (!m || !m.n){ t.className = 'track'; t.textContent = ''; t.title = ''; return; }
  if (m.n > 16){                                   // too many to segment: one bar, the done fraction and a knob
    t.className = 'track long' + (m.done ? ' all' : '');
    if (!t.querySelector('.fill')) t.innerHTML = '<i></i><i class="fill"></i><b></b>';
    t.querySelector('.fill').style.width = (100 * m.cur / m.n) + '%';
    t.querySelector('b').style.left = (m.done ? 100 : 100 * (m.cur + .5) / m.n) + '%';
    t.title = m.done ? 'Done' : (m.cur + 1) + '. ' + m.steps[m.cur];
    return;
  }
  t.className = 'track' + (m.done ? ' all' : ''); t.title = '';
  if (t.querySelector('.fill')) t.textContent = '';
  while (t.children.length < m.n) t.appendChild(document.createElement('i'));
  while (t.children.length > m.n) t.lastChild.remove();
  [...t.children].forEach((s, i) => { s.className = i < m.cur ? 'done' : i === m.cur ? 'now' : ''; s.title = (i + 1) + '. ' + m.steps[i]; });
}
function fillCard(c, a, now){
  const m = planOf(a), sl = stepLine(m);
  const cls = 'orb ' + (a.state || '') + (c.orb.classList.contains('ping') ? ' ping' : '');
  if (c.orb.className !== cls) c.orb.className = cls;      // away shows on the face only; the card keeps full ink
  setText(c.nm, a.title || 'Claude');
  setText(c.ago, when(Math.max(m ? m.updated : 0, +a.last_master || 0) || +a.seen || now));
  const unread = isUnread(c.key);                   // an unread reply; change notes keep the rail's dot and rows
  c.dot.classList.toggle('show', unread);
  const goal = m ? m.goal : '';
  setText(c.star, goal || 'No goal yet'); c.star.classList.toggle('none', !goal); c.star.title = goal;
  const tsig = m && m.n ? m.cur + '|' + m.steps.join('\n') : '';
  if (c.tsig !== tsig){ drawTrack(c.track, m); c.tsig = tsig; }
  const lsig = sl ? sl.count + '\n' + sl.text : '';
  if (c.lsig !== lsig){ c.line.innerHTML = sl ? `<b>${esc(sl.count)}</b> · ${esc(sl.text)}` : ''; c.lsig = lsig; }
  c.line.title = m && m.note ? m.note : '';
  c.el.setAttribute('aria-label', [a.title || 'Claude', MASTER[a.state] || '', goal ? 'goal: ' + goal : 'no goal yet',
    sl ? (m.done ? 'all ' + m.n + ' steps done' : 'step ' + sl.count + ', ' + sl.text) : '',
    'updated ' + c.ago.textContent, unread ? 'unread' : ''].filter(Boolean).join(', '));
  if (m && c.cur !== null && m.cur > c.cur) nod(c.el);    // the step moved on
  c.cur = m ? m.cur : null;
}
function ping(c){                                   // a new message landed on this agent: one ripple, one nod
  c.orb.classList.remove('ping'); void c.orb.offsetWidth; c.orb.classList.add('ping');
  clearTimeout(c.pingT); c.pingT = setTimeout(() => c.orb.classList.remove('ping'), 1300);
  nod(c.el);
}

function makeGap(p){
  const el = document.createElement('div'); el.className = 'pgap';
  const grp = document.createElementNS(SVGNS, 'g');
  const base = document.createElementNS(SVGNS, 'path'), run = document.createElementNS(SVGNS, 'path');
  base.setAttribute('class', 'lbase'); run.setAttribute('class', 'lrun'); run.style.opacity = '0';
  grp.append(base, run); svg.appendChild(grp);
  const g = {key: p.key, el, grp, base, run, html: '', d: '', last: null, drawn: still(), chase: [], timer: 0};
  ro.observe(el);                                   // its words wrap to a second line: the card below moves, the line follows
  requestAnimationFrame(() => el.classList.add('open'));
  if (!g.drawn){
    base.style.opacity = '0';
    g.timer = setTimeout(() => {                   // draw on once the two cards have glided together
      base.style.opacity = '';
      try{ A.animate(A.svg.createDrawable(base), {draw: ['0 0', '0 1'], duration: 700, ease: 'out(3)',
        onComplete: () => { g.drawn = true; syncMotion(); }}); }
      catch(e){ g.drawn = true; syncMotion(); }
    }, 450);
  }
  return g;
}
function fillGap(g, p, now){                        // "A → B · 2m", then the summary under it (two lines at most)
  const l = p.link, last = +l.last || 0, said = String(l.summary || '').replace(/\s+/g, ' ').trim();
  const html = `<div class="pin"><div class="pw"><b>${esc(titleOf(p.from) || 'Claude')}</b><i>→</i>` +
    `<b>${esc(titleOf(p.to) || 'Claude')}</b><em>· ${when(last || now)}</em></div>` +
    (said ? `<div class="ps">${esc(said)}</div>` : '') + `</div>`;
  if (g.html !== html){ g.el.innerHTML = html; g.html = html; }
  g.el.title = said;
  g.upper = p.upper; g.lower = p.lower; g.down = p.from === p.upper;   // the chase runs from sender to receiver
  if (g.last !== null && last > g.last && !still()){ const rc = pcards.get(agentKey(p.to)); if (rc) ping(rc); }
  g.last = last;
}
function retireGap(g){
  g.leaving = true; g.el.classList.add('leaving'); g.el.classList.remove('open');
  clearTimeout(g.timer); cancelAll(g.chase); g.run.style.opacity = '0';
  const done = () => { ro.unobserve(g.el); g.grp.remove(); g.el.remove(); if (pgaps.get(g.key) === g) pgaps.delete(g.key); };
  if (still()){ done(); return; }
  try{ A.animate(A.svg.createDrawable(g.base), {draw: '1 1', duration: 450, ease: 'in(2)'}); }catch(e){}
  setTimeout(done, 520);
}
function syncMotion(){                              // the chase runs while a pair is drawn, only where someone can see it
  const on = shown();
  if (on && !wasShown) scheduleLayout(0);          // back on screen: place the lines once (and finish a glide asked for while hidden)
  wasShown = on;
  for (const g of pgaps.values()){
    if (g.leaving) continue;
    const live = g.drawn;
    if (on && live && !still()){
      if (!g.chase.length){
        g.run.style.opacity = '1';
        try{ g.chase.push(A.animate(A.svg.createDrawable(g.run), {draw: ['0 0', '0 1', '1 1'],
          duration: 1900, loop: true, ease: 'inOutSine'})); }
        catch(e){ g.run.setAttribute('stroke-dasharray', '26 12'); }
      }
      continue;
    }
    cancelAll(g.chase);
    if (live && still()){ g.run.removeAttribute('stroke-dasharray'); g.run.removeAttribute('stroke-dashoffset'); g.run.style.opacity = '1'; }
    else g.run.style.opacity = '0';
  }
}

function render(agentsIn, linksIn){
  const now = Date.now() / 1000;
  const {order, pairs} = board(agentsIn, linksIn, now);
  const before = new Map();
  for (const [k, c] of pcards) if (!c.leaving) before.set(k, c.el.offsetTop);
  const want = new Set(order.map(a => agentKey(a.name)));
  for (const [k, c] of pcards){
    if (want.has(k) || c.leaving) continue;
    c.leaving = true; c.el.classList.add('leaving'); c.el.style.pointerEvents = 'none';
    exit(c.el, () => { ro.unobserve(c.el); c.el.remove(); if (pcards.get(k) === c) pcards.delete(k); scheduleLayout(0); });
  }
  const paired = new Set(pairs.map(p => p.key));
  for (const g of pgaps.values()) if (!g.leaving && !paired.has(g.key)) retireGap(g);
  const upperOf = new Map(pairs.map(p => [p.upper, p]));
  const seq = [], added = [];
  for (const a of order){
    const k = agentKey(a.name);
    let c = pcards.get(k);
    if (!c || c.leaving){ c = makeCard(k); pcards.set(k, c); added.push(c); }
    fillCard(c, a, now);
    seq.push(c.el);
    const p = upperOf.get(a.name);
    if (p){
      let g = pgaps.get(p.key);
      if (!g || g.leaving){ g = makeGap(p); pgaps.set(p.key, g); }
      fillGap(g, p, now);
      seq.push(g.el);
    }
  }
  if (!order.length){
    if (!emptyEl){ emptyEl = document.createElement('div'); emptyEl.className = 'railempty'; emptyEl.textContent = 'No agents working right now.'; }
    seq.push(emptyEl);
  } else if (emptyEl) emptyEl.remove();
  let ref = svg.nextElementSibling;                  // put the DOM in order; leaving cards and closing gaps stay put
  for (const el of seq){
    while (ref && ref !== el && ref.classList.contains('leaving')) ref = ref.nextElementSibling;
    if (ref === el) ref = ref.nextElementSibling;
    else plansEl.insertBefore(el, ref);
  }
  if (!still()) for (const [k, top] of before){       // cards that moved glide from where they were
    const c = pcards.get(k);
    if (!c || c.leaving || !c.el.isConnected) continue;
    const dy = top - c.el.offsetTop;
    if (Math.abs(dy) > 1) c.el.animate([{transform: `translateY(${dy}px)`}, {transform: 'none'}],
      {duration: 520, easing: 'cubic-bezier(.22,.9,.24,1)'});
  }
  added.forEach((c, i) => enter(c.el, i));
  // The lines follow frame by frame only when the cards, their order or the pairs changed (glides, gaps opening or
  // closing). A poll that changed none of that runs no frames; a card or gap that changes size asks through `ro`.
  const sig = seq.map(el => el.dataset.key || '').join('|') + '#' + pairs.map(p => p.key + '>' + p.from).join('|');
  if (sig !== boardSig){ boardSig = sig; scheduleLayout(700); }
  syncMotion();
}

new MutationObserver(syncMotion).observe(document.body, {attributes: true, attributeFilter: ['class']});
new MutationObserver(syncMotion).observe(lb, {attributes: true, attributeFilter: ['class']});
NARROW.addEventListener('change', syncMotion);
RM.addEventListener('change', syncMotion);
document.addEventListener('visibilitychange', syncMotion);

window.tsPanel = {render};
render(agents, links);
</script>
</body>
</html>
